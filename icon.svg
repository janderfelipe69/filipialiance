<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161226"/><stop offset="100%" stop-color="#0a0813"/>
    </linearGradient>
    <linearGradient id="pbTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a7a"/><stop offset="50%" stop-color="#ef2d3c"/><stop offset="100%" stop-color="#c01525"/>
    </linearGradient>
    <linearGradient id="pbBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d2dae6"/>
    </linearGradient>
    <radialGradient id="pbBtn" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#b7c1d1"/>
    </radialGradient>
    <clipPath id="pbClip"><circle cx="50" cy="50" r="46"/></clipPath>
