      <rect x="0" y="0"  width="100" height="50" fill="url(#pbTop)"/>
      <rect x="0" y="50" width="100" height="50" fill="url(#pbBot)"/>
      <rect x="0" y="44" width="100" height="12" fill="#14171e"/>
      <ellipse cx="34" cy="28" rx="16" ry="10" fill="#ffffff" opacity="0.30" transform="rotate(-22 34 28)"/>
    </g>
    <circle cx="50" cy="50" r="46" fill="none" stroke="#0e1118" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="15" fill="#14171e"/>
    <circle cx="50" cy="50" r="11.5" fill="#ffffff"/>
    <circle cx="50" cy="50" r="6.5" fill="url(#pbBtn)" stroke="#0e1118" stroke-width="1.5"/>
  </g>
